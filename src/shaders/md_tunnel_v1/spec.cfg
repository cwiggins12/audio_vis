// ============================================================
// polar tunnel - spec.cfg
// ============================================================
// 2 floats: accumulated scroll + smoothed steer angle
// ============================================================

// --- FFT ---
fftOrder = 12
hopAmount = 4
fftOutputMode = CUSTOM_SIZE
customFFTSize = 3
highMode = RMS
lowMode = LINEAR
fftOutputMeasurement = MAGNITUDE
perceptualSlopeDegrees = 3.0
useFFTSmoothing = true
fftAtk = 0.05
fftRls = 0.15
getFFTHolds = false
isFFTHannWindowed = true
normalizedFFT = true
normalizedFFTTime = 4.0

// --- Peak / RMS ---
isPeakRMSMono = true
isPeakRMSdB = false
usePeakRMSSmoothing = true
peakRMSAtk = 0.05
peakRMSRls = 0.15
getPeakRMSHolds = false

// --- Raw Samples ---
getRawSamples = false

// --- Feedback Buffer ---
// 2 floats: scroll position + steer angle
feedbackBufferSize = 2
feedbackBufferScalesWithWindow = NO_SCALE
feedbackBufferInitValue = 0.0
