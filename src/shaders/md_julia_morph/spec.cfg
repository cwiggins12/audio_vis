// ============================================================
// fractal zoom preset - spec.cfg
// ============================================================

// --- FFT ---
fftOrder = 10
hopAmount = 2
fftOutputMode = CUSTOM_SIZE
customFFTSize = 3
highMode = RMS
lowMode = LINEAR
fftOutputMeasurement = MAGNITUDE
perceptualSlopeDegrees = 3.0
useFFTSmoothing = true
fftAtk = 0.05
fftRls = 0.15
getFFTHolds = false
isFFTHannWindowed = true
normalizedFFT = true
normalizedFFTTime = 4.0
allowDroppedSamples = true
// --- Peak / RMS ---
isPeakRMSMono = true
isPeakRMSdB = false
usePeakRMSSmoothing = true
peakRMSAtk = 0.05
peakRMSRls = 0.15
getPeakRMSHolds = false

// --- Raw Samples ---
getRawSamples = true
isRawSamplesMono = true
isRawSamplesdB = false

// --- Feedback Buffer ---
// RGBA per pixel + 6 floats for band tracking
feedbackBufferSize = 8
feedbackBufferScalesWithWindow = NO_SCALE
feedbackBufferInitValue = 0.0
