// ============================================================
// milkdrop style template - spec.cfg
// ============================================================
// 3-band FFT output: bass (0), mid (1), treb (2)
// Magnitude mode (0.0 - 1.0) for easier math in warp/color equations
// Full framebuffer RGBA feedback buffer + 6 floats for _att and _avg values
// ============================================================

// --- FFT ---
fftOrder = 11
hopAmount = 2
fftOutputMode = CUSTOM_SIZE
customFFTSize = 3
highMode = RMS
lowMode = LINEAR
fftOutputMeasurement = MAGNITUDE
perceptualSlopeDegrees = 3.0
useFFTSmoothing = true
fftAtk = 0.05
fftRls = 0.15
getFFTHolds = false
isFFTHannWindowed = true
normalizedFFT = true
normalizedFFTTime = 4.0f;

// --- Peak / RMS ---
isPeakRMSMono = true
isPeakRMSdB = false
usePeakRMSSmoothing = true
peakRMSAtk = 0.05
peakRMSRls = 0.15
getPeakRMSHolds = false

// --- Raw Samples ---
getRawSamples = true
isRawSamplesMono = true
isRawSamplesdB = false

// --- Feedback Buffer ---
// RGBA per pixel + 6 floats for band tracking (att and avg for bass/mid/treb)
// The 6 band floats sit at the front, framebuffer pixels start at index 6
feedbackBufferSize = WINDOW_HEIGHT * WINDOW_WIDTH * 4 + 6
feedbackBufferScalesWithWindow = NO_SCALE
feedbackBufferInitValue = 0.0
